services:
  db:
    image: postgres:16-alpine
    container_name: fintracker-db
    environment:
      POSTGRES_DB: fintracker
      POSTGRES_USER: finuser
      POSTGRES_PASSWORD: finpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finuser -d fintracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fintracker-redis
    ports:
      - "6379:6379"
    profiles:
      - with-redis

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintracker-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=fintracker;Username=finuser;Password=finpass"
    ports:
      - "8080:8080"

volumes:
  pgdata:
